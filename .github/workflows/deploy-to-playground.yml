name: Deploy to PlayGround Org

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Deploy to PlayGround Environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        env:
          SF_AUTOUPDATE_DISABLE: true
          SF_TELEMETRY_DISABLE: true
        run: |
          npm install -g @salesforce/cli@latest

      - name: Pre-configure Salesforce CLI
        env:
          SF_AUTOUPDATE_DISABLE: true
          SF_TELEMETRY_DISABLE: true
          CI: true
        run: |
          # Suppress privacy/telemetry notice and pre-configure CLI
          sf config set telemetryEnabled=false || true
          sf config set disable-telemetry=true || true

      - name: Create JWT key file
        run: |
          echo "${{ secrets.SALESFORCE_JWT_KEY }}" > server.key
          chmod 600 server.key

      - name: Authenticate to PlayGround org
        env:
          SF_AUTOUPDATE_DISABLE: true
          SF_TELEMETRY_DISABLE: true
          CI: true
        run: |
          sf org login jwt \
            --username ${{ secrets.SALESFORCE_USERNAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.SALESFORCE_CLIENT_ID }} \
            --alias PlayGround \
            --set-default \
            --instance-url https://login.salesforce.com || true

      - name: Deploy to PlayGround org
        run: |
          echo "Deploying source to PlayGround org..."
          sf project deploy start \
            --source-dir force-app \
            --target-org PlayGround \
            --wait 10 \
            --test-level RunLocalTests \
            --ignore-conflicts

      - name: Post-deployment validation
        run: |
          echo "Running post-deployment validation..."
          sf apex run test \
            --target-org PlayGround \
            --wait 10 \
            --result-format human \
            --code-coverage \
            --output-dir test-results || echo "Some tests may have failed, but deployment completed"

      - name: Cleanup
        if: always()
        run: rm -f server.key

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🚀 **Environment**: PlayGround Org" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Source Path**: force-app" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Status**: Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: #${{ github.event.number }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to PlayGround org failed! Please check the logs."
